<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Esther Recio — Backend Developer</title>
  <desc id="desc">Banner com o nome Esther Recio, o cargo Backend Developer na Zenvia e um globo em wireframe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c6cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4fb"/>
    </radialGradient>
    <clipPath id="globeClip"><circle cx="960" cy="160" r="104"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .stars circle { fill: #7c3aed; animation: twinkle 4s ease-in-out infinite; }
    .stars circle:nth-child(3n) { animation-delay: -1.3s; }
    .stars circle:nth-child(3n+1) { animation-delay: -2.6s; }
    .grid { fill: none; stroke: #6366f1; stroke-opacity: 0.30; stroke-width: 1.2; }
    .name { font: 700 64px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: -1px; }
    .role { font: 500 26px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #1e293b; }
    .tags { font: 500 17px ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; letter-spacing: 0.5px; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <g class="stars">
      <circle cx="640" cy="40" r="1.4"/><circle cx="720" cy="270" r="1.1"/><circle cx="780" cy="70" r="1.6"/>
      <circle cx="1120" cy="48" r="1.2"/><circle cx="1160" cy="250" r="1.5"/><circle cx="1080" cy="290" r="1"/>
      <circle cx="840" cy="290" r="1.3"/><circle cx="700" cy="140" r="1"/><circle cx="1150" cy="150" r="1.1"/>
      <circle cx="560" cy="290" r="1.2"/><circle cx="600" cy="110" r="0.9"/><circle cx="820" cy="20" r="1"/>
    </g>

    <circle cx="960" cy="160" r="190" fill="url(#glow)"/>

    <!-- Globo em wireframe, levemente inclinado -->
    <circle cx="960" cy="160" r="104" fill="url(#sphere)"/>
    <g clip-path="url(#globeClip)" transform="rotate(-18 960 160)">
      <ellipse class="grid" cx="960" cy="160" rx="104" ry="104"/>
      <ellipse class="grid" cx="960" cy="160" rx="78" ry="104"/>
      <ellipse class="grid" cx="960" cy="160" rx="46" ry="104"/>
      <line class="grid" x1="960" y1="56" x2="960" y2="264"/>
      <ellipse class="grid" cx="960" cy="160" rx="104" ry="18"/>
      <ellipse class="grid" cx="960" cy="112" rx="92" ry="14"/>
      <ellipse class="grid" cx="960" cy="208" rx="92" ry="14"/>
      <ellipse class="grid" cx="960" cy="72" rx="56" ry="8"/>
      <ellipse class="grid" cx="960" cy="248" rx="56" ry="8"/>
    </g>
    <circle cx="960" cy="160" r="104" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.8"/>

    <g transform="rotate(-18 960 160)">
      <path id="orbitPath" d="M810 160a150 44 0 1 0 300 0a150 44 0 1 0-300 0" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="1.5"/>
      <circle r="5" fill="#0d9488">
        <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbitPath"/></animateMotion>
      </circle>
    </g>

    <text x="72" y="140" class="name" fill="url(#accent)">Esther Recio</text>
    <text x="74" y="186" class="role">Backend Developer @ Zenvia</text>
    <text x="74" y="232" class="tags">C# · .NET · APIs · MongoDB · SQL · Security · DevOps</text>
    <rect x="74" y="256" width="96" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
